name: Build and deploy ASP.Net Core app to Azure Web App - SuinsTruckAppBackend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.x"

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x"

      - name: Build solution
        run: dotnet build --configuration Release

      - name: Publish API
        run: dotnet publish WebApplication1/WebApplication1.csproj -c Release -o ${{ env.DOTNET_ROOT }}/myapp

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{ env.DOTNET_ROOT }}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download API artifact
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_8AA5F14456D74556A4AD4BBDD8AE4A72 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_E09D39F9B3E64A9DB6D44926B8BC1DB7 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_AB1119F54BE146C29806244BBD2FE030 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: "SuinsTruckAppBackend"
          slot-name: "Production"
          package: .

# Napomena: Azure Function (truckapp-functions) se deploy-uje ISKLJUČIVO iz
# main_truckapp-functions.yml. Ranije je i ovaj workflow imao deploy-functions job,
# pa su se dva deploy-a na istu funkciju trkala (crveni X). Uklonjeno da API i funkcija
# imaju po jedan, čist put deploya.
